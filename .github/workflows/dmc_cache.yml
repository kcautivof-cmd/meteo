name: DMC Cache Hourly

on:
  schedule:
    - cron: "0 * * * *"   # cada hora exacta
  workflow_dispatch:        # permite correrlo manualmente desde GitHub Actions

permissions:
  contents: write

jobs:
  fetch-dmc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run DMC scraper
        run: python fetch_dmc.py

      - name: Commit dmc_cache.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dmc_cache.json
          git diff --staged --quiet || git commit -m "chore: update dmc_cache [skip ci]"
          git push
